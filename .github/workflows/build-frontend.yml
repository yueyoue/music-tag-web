name: Build Frontend

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 14
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install dependencies
        working-directory: web
        run: npm install --registry https://registry.npmmirror.com

      - name: Build frontend
        working-directory: web
        run: npx webpack --config build/webpack.prod.conf.js

      - name: Fix asset paths in index.prod.html
        run: |
          # webpack generates ./static/js/ but correct path is ./static/dist/js/
          sed -i 's|\./static/js/|./static/dist/js/|g' static/dist/index.prod.html
          # ensure CSS link is present
          if ! grep -q 'app.css' static/dist/index.prod.html; then
            sed -i 's|</head>|<link href=./static/dist/css/app.css rel=stylesheet></head>|' static/dist/index.prod.html
          fi

      - name: Commit built files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add static/
          git diff --cached --quiet || git commit -m "build: update frontend dist [skip ci]"
          git push
