version: '3'

services:
  django:
    build: .
    container_name: music-tag-web
    ports:
      - "8002:8002"
    volumes:
      - /path/to/your/music:/app/media:z  # 改为你的音乐文件夹路径
    restart: always
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: music3
      MYSQL_USER: root
      MYSQL_PASSWORD: changeme  # 建议修改密码
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - db
    command: /start
  celeryworker:
    build: .
    container_name: music-celery-worker
    volumes:
      - /path/to/your/music:/app/media:z  # 同上
    restart: always
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: music3
      MYSQL_USER: root
      MYSQL_PASSWORD: changeme
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - db
    command: /start-celeryworker
  celerybeat:
    build: .
    container_name: music-celery-beat
    restart: always
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: music3
      MYSQL_USER: root
      MYSQL_PASSWORD: changeme
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - db
    command: /start-celerybeat
  redis:
    image: redis:7-alpine
    container_name: music-redis
    restart: always
  db:
    image: mysql:8.0
    container_name: music-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: changeme  # 建议修改密码
      MYSQL_DATABASE: music3
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
