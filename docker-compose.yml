version: '3'

services:
  django:
    build: .
    image: music-tag-web:latest
    container_name: music-tag-web
    expose:
      - "8001"
    volumes:
      - ./media:/app/media  # 配置本地音乐文件夹，按需修改
    restart: always
    environment:
      dockerrun: "yes"
    depends_on:
      - redis
      - db
    networks:
      - internal
    command: /start
  celeryworker:
    image: music-tag-web:latest
    container_name: music_celeryworker
    environment:
      dockerrun: "yes"
    ports: []
    volumes:
      - ./media:/app/media
    networks:
      - internal
    depends_on:
      - redis
      - db
    command: /start-celeryworker
  celerybeat:
    image: music-tag-web:latest
    container_name: music_celerybeat
    environment:
      dockerrun: "yes"
    ports: []
    networks:
      - internal
    depends_on:
      - redis
      - db
    command: /start-celerybeat
  redis:
    image: redis:latest
    restart: always
    container_name: music_redis
    networks:
      - internal
    expose:
      - "6379"
  db:
    image: mysql:latest
    restart: always
    environment:
      MYSQL_DATABASE: music3
      MYSQL_ROOT_PASSWORD: "123456"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    expose:
      - "3306"
  nginx:
    image: nginx:latest
    restart: always
    container_name: music_nginx
    ports:
      - "9150:80"
    networks:
      - internal
    depends_on:
      - django
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # 配置nginx.conf
      - ./media:/app/media

networks:
  internal:

volumes:
  mysql_data:
